name: Orca + OBN Managed Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/orca_obn_managed_package.yml'
      - 'managed-package/**'
  schedule:
    - cron: '17 4 * * *'
      timezone: 'America/Denver'

permissions:
  contents: write

concurrency:
  group: orca-obn-managed-package
  cancel-in-progress: true

env:
  OBN_ABI: '02.03.00.99'
  ORCA_NIGHTLY_ASSET: 'OrcaSlicer_Windows_Installer_x64_nightly.exe'

jobs:
  build-windows-x64:
    name: Build managed Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout controller files
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/orca_obn_managed_package.yml
            managed-package
          sparse-checkout-cone-mode: false

      - name: Checkout latest upstream OBN
        uses: actions/checkout@v6
        with:
          repository: ClusterM/open-bamboo-networking
          ref: master
          fetch-depth: 0
          persist-credentials: false
          path: obn

      - name: Layer Cody printer-selection fix onto upstream OBN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "$env:GITHUB_WORKSPACE\obn"
          try {
            $upstreamSha = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Could not read upstream OBN SHA.' }

            git remote add cody https://github.com/CodyPrince/open-bamboo-networking.git
            if ($LASTEXITCODE -ne 0) { throw 'Could not add Cody OBN remote.' }

            git fetch --no-tags cody fix/issue-78-printer-selection
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch printer-selection fix branch.' }

            $fixSha = (git rev-parse FETCH_HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Could not read printer-selection fix SHA.' }

            # GitHub-hosted runners do not have a committer identity by default.
            # --no-ff merge preparation still requires one even though we stop
            # before committing the temporary merge.
            git config user.name 'Orca OBN Managed Build'
            if ($LASTEXITCODE -ne 0) { throw 'Could not configure CI Git user.name.' }
            git config user.email 'actions@github.com'
            if ($LASTEXITCODE -ne 0) { throw 'Could not configure CI Git user.email.' }

            git merge --no-commit --no-ff FETCH_HEAD
            if ($LASTEXITCODE -ne 0) {
              git merge --abort 2>$null
              throw 'Printer-selection fix no longer merges cleanly with current upstream OBN. Managed build stopped rather than publishing a package without the fix.'
            }

            "OBN_UPSTREAM_SHA=$upstreamSha" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "OBN_PRINTER_FIX_SHA=$fixSha" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          }
          finally {
            Pop-Location
          }

      - name: Apply or detect H2C DirectShow camera fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = "$env:GITHUB_WORKSPACE\obn\stubs\dshow_filter.cpp"
          $patchPath  = "$env:GITHUB_WORKSPACE\managed-package\obn-h2c-camera-dshow.patch"

          # actions/checkout on Windows may materialize text files as CRLF.
          # A unified diff must be applied with LF line endings or the CR
          # becomes trailing whitespace in every added source line.
          $normalizedPatchPath = Join-Path $env:RUNNER_TEMP 'obn-h2c-camera-dshow-lf.patch'
          $patchText = [System.IO.File]::ReadAllText($patchPath)
          $patchText = $patchText.Replace("`r`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText(
            $normalizedPatchPath,
            $patchText,
            [System.Text.UTF8Encoding]::new($false)
          )

          $source = Get-Content -LiteralPath $sourcePath -Raw
          $hasLvField    = $source.Contains('std::string lv;')
          $hasLvParse    = $source.Contains('else if (k == "lv") out->lv = v;')
          $hasRtspsRoute = $source.Contains('out->lv == "rtsps"') -and
                           $source.Contains('out->scheme = UrlScheme::Rtsps')

          if ($hasLvField -and $hasLvParse -and $hasRtspsRoute) {
            $state = 'upstream'
            Write-Host 'Equivalent H2C DirectShow lv=rtsps handling is already present upstream; saved patch not needed.'
          }
          else {
            Push-Location "$env:GITHUB_WORKSPACE\obn"
            try {
              git apply --check "$normalizedPatchPath"
              if ($LASTEXITCODE -ne 0) {
                throw 'Saved H2C camera patch no longer applies cleanly to current upstream OBN. Managed build stopped for review.'
              }

              git apply "$normalizedPatchPath"
              if ($LASTEXITCODE -ne 0) { throw 'Failed to apply H2C camera patch.' }

              git diff --check
              if ($LASTEXITCODE -ne 0) { throw 'H2C camera patch produced a whitespace/error check failure.' }
            }
            finally {
              Pop-Location
            }
            $state = 'managed-patch'
          }

          $patched = Get-Content -LiteralPath $sourcePath -Raw
          if (-not (
            $patched.Contains('std::string lv;') -and
            $patched.Contains('else if (k == "lv") out->lv = v;') -and
            $patched.Contains('out->lv == "rtsps"') -and
            $patched.Contains('out->scheme = UrlScheme::Rtsps')
          )) {
            throw 'Final DirectShow source does not contain the required H2C camera routing logic.'
          }

          $patchSha = (Get-FileHash -LiteralPath $normalizedPatchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "CAMERA_PATCH_STATE=$state" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "CAMERA_PATCH_SHA=$patchSha" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Configure OBN for Orca ABI 02.03.00.99
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = "$env:GITHUB_WORKSPACE\obn-install"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Push-Location "$env:GITHUB_WORKSPACE\obn"
          try {
            .\configure.ps1 `
              -ClientType orca_slicer `
              -WithVersion $env:OBN_ABI `
              -Prefix $staging `
              -Architecture x64 `
              -VcpkgTriplet x64-windows-static-md `
              -PatchConf:$false `
              -RegisterDShowFilter:$false `
              -EnableTests:$true
            if ($LASTEXITCODE -ne 0) { throw 'OBN configure failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Build and test managed OBN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "$env:GITHUB_WORKSPACE\obn"
          try {
            cmake --build build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw 'OBN build failed.' }

            ctest --test-dir build -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'OBN tests failed.' }

            cmake --install build --config Release
            if ($LASTEXITCODE -ne 0) { throw 'OBN install staging failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Download official Orca nightly and assemble package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $headers = @{
            'Accept' = 'application/vnd.github+json'
            'Authorization' = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'Cody-Orca-OBN-Managed-Package'
          }

          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/tags/nightly-builds' `
            -Headers $headers

          $asset = @($release.assets) |
            Where-Object { $_.name -eq $env:ORCA_NIGHTLY_ASSET } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Official nightly asset not found: $env:ORCA_NIGHTLY_ASSET"
          }

          $packageDir = "$env:GITHUB_WORKSPACE\package"
          $pluginsDir = Join-Path $packageDir 'plugins'
          $distDir    = "$env:GITHUB_WORKSPACE\dist"

          New-Item -ItemType Directory -Force -Path $pluginsDir, $distDir | Out-Null

          $stagedPlugins = "$env:GITHUB_WORKSPACE\obn-install\plugins"
          if (-not (Test-Path -LiteralPath $stagedPlugins)) {
            throw "OBN staged plugins directory not found: $stagedPlugins"
          }

          Copy-Item -Path (Join-Path $stagedPlugins '*') -Destination $pluginsDir -Recurse -Force

          $orcaInstaller = Join-Path $packageDir $env:ORCA_NIGHTLY_ASSET
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $orcaInstaller -UseBasicParsing

          $orcaHash = (Get-FileHash -LiteralPath $orcaInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -and ([string]$asset.digest).StartsWith('sha256:')) {
            $expected = ([string]$asset.digest).Substring(7).ToLowerInvariant()
            if ($orcaHash -ne $expected) {
              throw "Downloaded Orca nightly SHA256 mismatch. Expected $expected, got $orcaHash."
            }
          }

          $pluginFiles = @(
            Get-ChildItem -LiteralPath $pluginsDir -File -Recurse |
              Sort-Object FullName |
              ForEach-Object {
                [ordered]@{
                  name   = $_.FullName.Substring($pluginsDir.Length + 1).Replace('\','/')
                  bytes  = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )

          $bambuSource = Get-ChildItem -LiteralPath $pluginsDir -Filter 'BambuSource.dll' -File -Recurse |
            Select-Object -First 1
          if (-not $bambuSource) {
            throw 'Managed OBN build did not produce BambuSource.dll.'
          }

          $cameraHash = (Get-FileHash -LiteralPath $bambuSource.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $previousKnownGood = '47cfa5e896644522379325726fecbe7966ce3d8ed84fc4c9822fb87332b4333d'

          $manifest = [ordered]@{
            schema = 1
            generated_utc = [DateTime]::UtcNow.ToString('o')
            controller = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit = $env:GITHUB_SHA
            }
            orca = [ordered]@{
              source_repository = 'OrcaSlicer/OrcaSlicer'
              release_tag = 'nightly-builds'
              asset_name = [string]$asset.name
              asset_url = [string]$asset.browser_download_url
              asset_updated_at = [string]$asset.updated_at
              asset_api_digest = [string]$asset.digest
              downloaded_sha256 = $orcaHash
              bytes = (Get-Item -LiteralPath $orcaInstaller).Length
            }
            obn = [ordered]@{
              upstream_repository = 'ClusterM/open-bamboo-networking'
              upstream_sha = $env:OBN_UPSTREAM_SHA
              printer_fix_repository = 'CodyPrince/open-bamboo-networking'
              printer_fix_ref = 'fix/issue-78-printer-selection'
              printer_fix_sha = $env:OBN_PRINTER_FIX_SHA
              abi = $env:OBN_ABI
              camera_fix_state = $env:CAMERA_PATCH_STATE
              camera_patch_sha256 = $env:CAMERA_PATCH_SHA
              built_bambusource_sha256 = $cameraHash
              previous_known_good_bambusource_sha256 = $previousKnownGood
              built_bambusource_matches_previous = ($cameraHash -eq $previousKnownGood)
              files = $pluginFiles
            }
          }

          $manifestPath = Join-Path $packageDir 'managed-manifest.json'
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding utf8

          @"
          ORCA + OBN MANAGED PACKAGE

          This package contains:
            - the untouched official OrcaSlicer Windows x64 nightly installer;
            - OBN built from current upstream master;
            - Cody's printer-selection persistence/reconnect fix;
            - the H2C DirectShow lv=rtsps camera fix;
            - managed-manifest.json with source SHAs and SHA256 hashes.

          IMPORTANT:
          This first managed-package build is intentionally pinned to OBN ABI 02.03.00.99,
          matching the proven working Orca/OBN setup. It does not automatically replace
          the current local installation yet. Hardware-test the managed build first.
          "@ | Set-Content -LiteralPath (Join-Path $packageDir 'README.txt') -Encoding utf8

          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $distDir 'managed-manifest.json') -Force

          $zipPath = Join-Path $distDir 'Orca-OBN-Managed-Windows-x64.zip'
          Push-Location $packageDir
          try {
            & 'C:\Program Files\7-Zip\7z.exe' a -tzip $zipPath '*'
            if ($LASTEXITCODE -ne 0) { throw '7-Zip failed while creating managed package.' }
          }
          finally {
            Pop-Location
          }

          $packageHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$packageHash" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Save workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Orca-OBN-Managed-Windows-x64
          path: |
            dist/Orca-OBN-Managed-Windows-x64.zip
            dist/managed-manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Update rolling managed prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'orca-obn-managed-latest'
          $shortObn = $env:OBN_UPSTREAM_SHA.Substring(0, 7)

          @"
          Automatic managed Windows x64 package.

          Includes:
          - untouched official OrcaSlicer nightly installer
          - latest upstream Open Bamboo Networking
          - Cody printer-selection persistence/reconnect fix
          - H2C DirectShow camera fix
          - pinned OBN ABI: $env:OBN_ABI

          OBN upstream: $env:OBN_UPSTREAM_SHA
          Printer fix: $env:OBN_PRINTER_FIX_SHA
          Camera patch: $env:CAMERA_PATCH_STATE
          Package SHA256: $env:PACKAGE_SHA256
          "@ | Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\release-notes.md" -Encoding utf8

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "Orca + OBN Managed Package ($shortObn)" `
              --notes-file "$env:GITHUB_WORKSPACE\release-notes.md" `
              --prerelease

            if ($LASTEXITCODE -ne 0) { throw 'Could not update rolling managed prerelease.' }
          }
          else {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Orca + OBN Managed Package ($shortObn)" `
              --notes-file "$env:GITHUB_WORKSPACE\release-notes.md" `
              --prerelease

            if ($LASTEXITCODE -ne 0) { throw 'Could not create rolling managed prerelease.' }
          }

          gh release upload $tag `
            "$env:GITHUB_WORKSPACE\dist\Orca-OBN-Managed-Windows-x64.zip" `
            "$env:GITHUB_WORKSPACE\dist\managed-manifest.json" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) { throw 'Could not upload managed release assets.' }
