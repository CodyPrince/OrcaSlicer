name: Cody Custom Orca Nightly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cody_custom_orca_nightly.yml'
      - 'bambu-connect.patch'
      - 'apply-bambu-connect.py'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'America/Denver'

permissions:
  contents: write

concurrency:
  group: cody-custom-orca-nightly
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Latest Orca + Saved Bambu Connect
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout our saved Bambu Connect files
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            bambu-connect.patch
            apply-bambu-connect.py
          sparse-checkout-cone-mode: false
          path: controller

      - name: Checkout latest official OrcaSlicer main
        uses: actions/checkout@v7
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: main
          fetch-depth: 0
          lfs: 'false'
          persist-credentials: false
          path: source

      - name: Apply our saved Bambu Connect feature
        working-directory: ${{ github.workspace }}/source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $featureAlreadyInMain = Select-String `
            -Path "src/libslic3r/AppConfig.cpp" `
            -Pattern 'show_bambu_connect_export' `
            -Quiet

          if ($featureAlreadyInMain) {
            Write-Host "Official Orca already contains the Bambu Connect export feature. Saved patch not needed."
          }
          else {
            $patch = "$env:GITHUB_WORKSPACE\controller\bambu-connect.patch"
            $applier = "$env:GITHUB_WORKSPACE\controller\apply-bambu-connect.py"

            python $applier $patch $env:GITHUB_WORKSPACE\source
            if ($LASTEXITCODE -ne 0) {
              throw "Our saved Bambu Connect feature could not be safely applied to the newest Orca main."
            }

            Write-Host "Applied our permanently saved Bambu Connect feature."
          }

          $upstreamSha = (git rev-parse HEAD).Trim()
          $patchSha = (Get-FileHash "$env:GITHUB_WORKSPACE\controller\bambu-connect.patch" -Algorithm SHA256).Hash.ToLower()

          "UPSTREAM_SHA=$upstreamSha" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "PATCH_SHA=$patchSha"       | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v3

      - name: Compute Orca dependency cache key
        id: deps-key
        shell: pwsh
        run: |
          "key=windows-x64-cache-orcaslicer_deps-build-${{ hashFiles('source/deps/**') }}" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Restore Orca dependency cache
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/source/deps/build/OrcaSlicer_dep
          key: ${{ steps.deps-key.outputs.key }}

      - name: Build Orca dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install strawberryperl -y --no-progress
          .\build_release_vs.bat deps
          .\build_release_vs.bat pack

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build OrcaSlicer
        working-directory: ${{ github.workspace }}/source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build_release_vs.bat slicer

      - name: Read Orca version
        working-directory: ${{ github.workspace }}/source
        shell: pwsh
        run: |
          $versionContent = Get-Content version.inc -Raw
          if ($versionContent -notmatch 'set\(SoftFever_VERSION "(.*?)"\)') {
            throw "Could not read OrcaSlicer version from version.inc"
          }

          $orcaVersion = "V$($matches[1])"
          $buildDate = Get-Date -Format 'yyyy-MM-dd'

          "ORCA_VERSION=$orcaVersion" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "BUILD_DATE=$buildDate"     | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Create Windows installer
        working-directory: ${{ github.workspace }}/source/build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cpack -G NSIS

      - name: Prepare installer and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null

          $installer = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\source\build" -Filter 'OrcaSlicer*.exe' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not produced."
          }

          Copy-Item `
            $installer.FullName `
            "$env:GITHUB_WORKSPACE\dist\OrcaSlicer_Custom_Nightly_Bambu_Connect_x64.exe" `
            -Force

          Push-Location "$env:GITHUB_WORKSPACE\source\build"
          & "C:\Program Files\7-Zip\7z.exe" a -tzip `
            "$env:GITHUB_WORKSPACE\dist\OrcaSlicer_Custom_Nightly_Bambu_Connect_x64_portable.zip" `
            "OrcaSlicer"
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "7-Zip failed while creating the portable build."
          }
          Pop-Location

          @"
          Cody custom OrcaSlicer nightly
          Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')
          Orca version: $env:ORCA_VERSION
          Official Orca main: $env:UPSTREAM_SHA
          Bambu Connect patch: bambu-connect.patch
          Bambu Connect patch SHA256: $env:PATCH_SHA
          "@ | Set-Content -Path "$env:GITHUB_WORKSPACE\dist\BUILD_INFO.txt" -Encoding utf8

      - name: Save workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cody-Custom-Orca-Windows-x64-${{ env.BUILD_DATE }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Update rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $shortSha = $env:UPSTREAM_SHA.Substring(0, 7)
          $notes = @"
          Automatic Windows x64 build of the latest official OrcaSlicer main with
          Cody's permanently saved Bambu Connect patch.

          Orca version: $env:ORCA_VERSION
          Official Orca main: $env:UPSTREAM_SHA
          Saved patch SHA256: $env:PATCH_SHA
          Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')
          "@

          $notes | Set-Content -Path release-notes.md -Encoding utf8

          gh release view custom-nightly-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit custom-nightly-latest `
              --repo $env:GITHUB_REPOSITORY `
              --title "OrcaSlicer Custom Nightly - Bambu Connect ($shortSha)" `
              --notes-file release-notes.md `
              --prerelease
          }
          else {
            gh release create custom-nightly-latest `
              --repo $env:GITHUB_REPOSITORY `
              --target main `
              --title "OrcaSlicer Custom Nightly - Bambu Connect ($shortSha)" `
              --notes-file release-notes.md `
              --prerelease
          }

          gh release upload custom-nightly-latest `
            "$env:GITHUB_WORKSPACE\dist\OrcaSlicer_Custom_Nightly_Bambu_Connect_x64.exe" `
            "$env:GITHUB_WORKSPACE\dist\OrcaSlicer_Custom_Nightly_Bambu_Connect_x64_portable.zip" `
            "$env:GITHUB_WORKSPACE\dist\BUILD_INFO.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
